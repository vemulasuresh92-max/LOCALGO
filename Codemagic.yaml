workflows:
  localgo_android:
    name: LOCALGO Android Release
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Create Android project files
        script: |
          flutter create . --platforms=android

      - name: Build Google Play AAB
        script: |
          flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.aab
